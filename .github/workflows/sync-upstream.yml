# 上游数据定时同步:h9dh.cn 出新表 -> 下载 -> 三道验收 -> 全绿才落地
#
# 无变化的调度只发一次几 KB 的首页请求即退出,对上游站零打扰。
# manifest 只在验收全绿后 commit;验收失败自动开 issue(带 label 去重)。
# 部署作业默认关闭:web 应用就绪后,在仓库 Variables 设 DEPLOY_ENABLED=true
# 并补上 Cloudflare secrets,替换掉占位构建步骤。

name: sync-upstream

on:
  schedule:
    - cron: "17 1,13 * * *" # UTC,即北京时间 09:17 / 21:17
  workflow_dispatch:
    inputs:
      force:
        description: 忽略 manifest 强制全量同步验证
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.sync.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 安装依赖
        run: pip install -r scripts/excel_codegen/requirements.txt

      - name: 抓取清单并按需下载
        id: sync
        run: python scripts/sync_upstream.py ${{ inputs.force && '--force' || '' }}

      - name: 验收 1/3:公式解析往返
        if: steps.sync.outputs.changed == 'true'
        working-directory: scripts/excel_codegen
        run: python parse_corpus.py

      - name: 验收 2/3:缓存值金标准
        if: steps.sync.outputs.changed == 'true'
        working-directory: scripts/excel_codegen
        run: python verify_golden.py

      - name: 验收 3/3:优化等价性
        if: steps.sync.outputs.changed == 'true'
        working-directory: scripts/excel_codegen
        run: python verify_equiv.py --trials 2

      - name: 输入格摘要(unmapped>0 即失败)
        if: steps.sync.outputs.changed == 'true'
        working-directory: scripts/excel_codegen
        run: python scan_inputs.py

      - name: 运行时模块构建 + 接线验收
        if: steps.sync.outputs.changed == 'true'
        working-directory: scripts/excel_codegen
        run: |
          python build_runtime.py
          python verify_runtime.py

      - name: 提交 manifest 与输入格摘要
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "temper-sync[bot]"
          git config user.email "temper-sync@users.noreply.github.com"
          git add data/upstream-manifest.json data/flow-inputs.json
          if git diff --cached --quiet; then
            echo "manifest 无实际变化,跳过提交"
          else
            git commit -m "chore: 上游数据同步 $(date -u +%F)"
            git push
          fi

      - name: 验收失败开 issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label upstream-sync-failure --state open --json number --jq length)
          if [ "$existing" = "0" ]; then
            gh issue create \
              --title "上游同步验收失败 $(date -u +%F)" \
              --label upstream-sync-failure \
              --body "定时同步在验收阶段失败,可能是上游 xlsx 改了版式或出现新语法。查看运行日志:${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}。修复后手动 workflow_dispatch(force)重跑。"
          else
            echo "已有未关闭的失败 issue,不重复创建"
          fi

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 安装依赖
        run: pip install -r scripts/excel_codegen/requirements.txt
      - name: 拉取上游 xlsx(upstream/ 不进 git,按 manifest 现拉)
        run: python scripts/sync_upstream.py --force
      - name: 构建运行时模块并验收
        working-directory: scripts/excel_codegen
        run: |
          python build_runtime.py
          python verify_runtime.py
      - name: 组装站点
        run: python scripts/build_site.py
      - name: 部署 Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler pages deploy dist/site --project-name=temper --branch=main
